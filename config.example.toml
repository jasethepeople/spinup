# Copy to config.toml. The mock backend is for tests only, not real repositories.
runtime = "docker"                 # docker, podman, or mock
max_attempts = 8
clone_timeout_seconds = 120
command_timeout_seconds = 180
verify_timeout_seconds = 20

[sandbox]
image = ""                         # optional override; normally selected by stack
cpu = "1.0"
memory = "1g"
pids = 256
workspace_mb = 1024
tmp_mb = 256
network_allowlist = ["pypi.org", "files.pythonhosted.org", "registry.npmjs.org", "github.com", "api.github.com", "proxy.golang.org", "sum.golang.org", "crates.io", "static.crates.io", "index.crates.io"]
squid_image = "ubuntu/squid:6.6-24.04_beta"
base_images = { python = "python:3.11-slim", node = "node:20-bookworm-slim", go = "golang:1.22-bookworm", rust = "rust:1-bookworm", compose = "python:3.11-slim", unknown = "python:3.11-slim" }

[llm]
provider = "ollama"               # ollama or anthropic
model = "qwen2.5-coder:7b"
enabled = true
timeout_seconds = 45
# Ollama URL defaults to http://127.0.0.1:11434.
# Anthropic reads ANTHROPIC_API_KEY on the host only; it is never passed to containers.

[paths]
work = "work"
recipes = "recipes"
database = "spinup.db"
